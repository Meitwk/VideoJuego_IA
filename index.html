<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack 21 - Casino Clásico</title>
    <link rel="stylesheet" href="style.css">
    <!-- Motor Three.js para gráficos 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- PeerJS para conexión P2P en tiempo real -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <!-- MENÚ PRINCIPAL -->
    <div id="login-screen">
        <div class="login-card">
            <h1>BLACKJACK 21</h1>
            <p>Selecciona tu modo de juego</p>

            <div class="mode-selector" style="display: flex; gap: 10px; margin-bottom: 10px;">
                <button id="mode-solo-btn" class="action-btn" style="flex:1;">1 JUGADOR</button>
                <button id="mode-multi-btn" style="flex:1; background: #2563eb;">MULTIJUGADOR</button>
            </div>

            <input type="text" id="username-input" placeholder="Tu Apodo" value="Jugador1" maxlength="12">

            <!-- SELECCIÓN MULTIJUGADOR -->
            <div id="multi-sub-selector" style="display: none; gap: 10px; margin-top: 5px;">
                <button id="btn-tab-create" style="flex:1; background: #059669; font-size: 0.85rem;">CREAR SALA</button>
                <button id="btn-tab-join" style="flex:1; background: #3b82f6; font-size: 0.85rem;">UNIRSE A SALA</button>
            </div>

            <!-- CREAR SALA -->
            <div id="panel-create-room" style="display: none; flex-direction: column; gap: 10px; margin-top: 10px; background: rgba(15, 23, 42, 0.6); padding: 12px; border-radius: 8px; border: 1px solid #10b981;">
                <p style="font-size: 0.8rem; color: #a7f3d0;">Tu código de sala:</p>
                <div id="generated-code-display" style="font-size: 1.4rem; font-weight: bold; color: #facc15; letter-spacing: 2px;">BJ-XXXX</div>
                <button id="btn-start-host" class="action-btn">ABRIR MESA Y ESPERAR</button>
            </div>

            <!-- UNIRSE A SALA -->
            <div id="panel-join-room" style="display: none; flex-direction: column; gap: 10px; margin-top: 10px;">
                <input type="text" id="join-code-input" placeholder="Pega el código aquí (Ej: BJ-8X42)" maxlength="8" style="text-transform: uppercase;">
                <button id="btn-start-client" style="background: #2563eb;">CONECTAR A LA SALA</button>
            </div>

            <!-- BOTÓN SOLITARIO -->
            <button id="btn-enter-solo" class="action-btn" style="margin-top: 10px;">ENTRAR AL CASINO</button>
        </div>
    </div>

    <!-- PANTALLA DE JUEGO -->
    <div id="game-screen" style="display: none;">
        <canvas id="webgl-canvas"></canvas>

        <div id="pause-overlay" style="display: none;">
            <div class="pause-card">
                <h2>MENÚ DE PAUSA</h2>
                <p>Presiona <b>ESC</b> para continuar</p>
                <button id="btn-resume" class="action-btn">CONTINUAR</button>
                <button id="btn-exit" class="exit-btn">VOLVER AL MENÚ</button>
            </div>
        </div>

        <div class="table-header">
            <div class="room-info">SALA: <span id="room-display">SOLITARIO</span></div>
            <h2>MESA DE CASINO</h2>
            <div class="user-info">JUGADOR: <span id="user-display"></span> <span class="esc-hint">(ESC: Menú)</span></div>
        </div>

        <div id="status-message">¡Meta: Alcanzar $2,000 fichas!</div>

        <div class="stats-panel">
            <div>Fichas: <span id="chips-display">$1000</span> / $2000</div>
            <div>Puntos Jugador: <span id="player-score-display">0</span></div>
            <div>Puntos Crupier: <span id="dealer-score-display">?</span></div>
        </div>

        <div class="controls-bar">
            <button id="btn-hit" disabled>PEDIR (HIT)</button>
            <button id="btn-stand" disabled>PLANTARSE</button>
            <button id="btn-power" class="power-btn" disabled>PODER: RECAMBIO</button>
            <button id="btn-start" class="action-btn">NUEVA RONDA</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
